<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0" />
    </linearGradient>
    <filter id="shadow3d" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#4f46e5" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Background with subtle corner radius -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Ambient background glow aura -->
  <circle cx="256" cy="240" r="160" fill="url(#glowGrad)" />

  <!-- 3D Geometric Maktub Play/Book Sanctuary Emblem -->
  <g filter="url(#shadow3d)" transform="translate(256,256)">
    <!-- Left Book Wing (Open Page / Focus Horizon) -->
    <path d="M-110,-70 C-50,-90 -10,-75 0,-50 L0,100 C-10,75 -50,60 -110,80 Z" 
          fill="url(#primaryGrad)" 
          opacity="0.85" />

    <!-- Right Book Wing -->
    <path d="M110,-70 C50,-90 10,-75 0,-50 L0,100 C10,75 50,60 110,80 Z" 
          fill="url(#primaryGrad)" 
          opacity="0.95" />

    <!-- Central Floating 3D Play Crystal (Exam Study Prism) -->
    <polygon points="-24,-55 70,0 -24,55" 
             fill="#ffffff" 
             opacity="0.98" />
    
    <!-- Accent Focus Spark / Golden Dot -->
    <circle cx="78" cy="-55" r="9" fill="url(#accentGrad)" />
    <circle cx="98" cy="-35" r="5" fill="#38bdf8" />
  </g>

  <!-- Modern typography accent: MAKTUB -->
  <text x="256" y="440" 
        font-family="system-ui, -apple-system, sans-serif" 
        font-size="34" 
        font-weight="800" 
        letter-spacing="9" 
        fill="#f8fafc" 
        text-anchor="middle" 
        opacity="0.92">MAKTUB</text>
  <text x="256" y="468" 
        font-family="system-ui, -apple-system, sans-serif" 
        font-size="14" 
        font-weight="500" 
        letter-spacing="4" 
        fill="#94a3b8" 
        text-anchor="middle" 
        opacity="0.8">DISTRACTION-FREE STUDY</text>
</svg>
